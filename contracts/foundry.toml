[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
# BOT Chain 968 & 677 mendukung PUSH0/MCOPY/TSTORE (dicek via eth_call 2026-10-17); OZ 5.7 butuh MCOPY
evm_version = "cancun"
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
bohr = "https://rpc.bohr.life"       # testnet, chain 968
botchain = "https://rpc.botchain.ai" # mainnet, chain 677

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
